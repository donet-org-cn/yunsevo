<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沄序 · 全景看房</title><link rel="stylesheet" href="panorama.css"></head><body>
<canvas id="panorama" aria-label="全景，拖动环视，滚轮或双指缩放" tabindex="0"></canvas><img id="source" hidden alt="">
<header><strong>沄序 · 全景看房</strong><span id="status" role="status">正在加载全景…</span></header>
<footer><div class="actions"><button id="reset">回到初始视角</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="fullscreen">全屏</button></div><p>拖动环视 · 滚轮／双指缩放 · 方向键转向<br>全景为照片拼接；深色区域是未拍到的顶部和地面。</p></footer>
<script src="panorama.js"></script></body></html>
