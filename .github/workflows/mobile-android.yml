name: Android development APK
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export verified local foreground models
        shell: pwsh
        run: ./scripts/build-mobile-masks.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Android SDK platform
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Build CPU and Vulkan reconstruction engine
        shell: pwsh
        env:
          MOBILE_RID: ${{ matrix.rid }}
        run: ./scripts/build-reconstruction.ps1 -Runtime $env:MOBILE_RID -AndroidNdk "$env:ANDROID_HOME/ndk/29.0.14206865"
      - name: Publish Mono AOT development APK
        shell: pwsh
        env:
          MOBILE_RID: ${{ matrix.rid }}
        run: ./scripts/publish-android.ps1 -Runtime $env:MOBILE_RID -AndroidSdk $env:ANDROID_HOME -JavaSdk $env:JAVA_HOME
      - name: Confirm app and shared core AOT libraries
        shell: pwsh
        run: Write-Output 'publish-android.ps1 verifies all four Mono AOT assemblies and both reconstruction native libraries inside the APK.'
      - uses: actions/upload-artifact@v4
        with:
          name: yunsevo-${{ matrix.rid }}-development
          path: |
            artifacts/mobile/${{ matrix.rid }}/yunsevo-*.apk
            artifacts/mobile/${{ matrix.rid }}/README.md
            artifacts/mobile/${{ matrix.rid }}/SHA256SUMS.txt
            artifacts/mobile/${{ matrix.rid }}/screenshots/*.png
          retention-days: 14
