name: Release all platforms
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v2.6.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Native ${{ matrix.rid }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux native and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libicu-dev libfontconfig1 libx11-6 libice6 libsm6 libxrandr2 libxcursor1 libxi6 xvfb libgl1-mesa-dri libegl1 libgl1 fonts-noto-cjk
      - name: Publish native Windows programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime '${{ matrix.rid }}' -Output 'artifacts/v2/${{ matrix.rid }}'
      - name: Publish native Unix programs
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/publish.sh '${{ matrix.rid }}' 'artifacts/v2/${{ matrix.rid }}'
      - name: Package server and all clients
        shell: pwsh
        run: ./scripts/package-release.ps1 -Runtime '${{ matrix.rid }}' -PublishRoot 'artifacts/v2/${{ matrix.rid }}'
      - name: Extract release packages and verify native programs
        shell: pwsh
        env:
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $rid = $env:RELEASE_RID
          $extension = if ($rid.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $root = ".test-data/release-unpacked/$rid"
          foreach ($role in @(@('server','server'), @('drive','desktop'), @('headless','headless'))) {
            $destination = Join-Path $root $role[1]
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            $archive = "artifacts/release/yunsevo-$($role[0])-$rid.$extension"
            if ($extension -eq 'zip') {
              Expand-Archive -LiteralPath $archive -DestinationPath $destination
            } else {
              & tar -xzf $archive -C $destination
              if ($LASTEXITCODE -ne 0) { throw "Release extraction failed: $archive" }
            }
          }
          node scripts/release-smoke.mjs $rid $root
          if ($LASTEXITCODE -ne 0) { throw 'Native release verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify platform completeness and checksums
        shell: bash
        run: |
          cd artifacts/release
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            ext=tar.gz; [[ "$rid" == win-* ]] && ext=zip
            for role in server drive headless; do test -s "yunsevo-$role-$rid.$ext"; done
            test -s "verification-$rid.json"
          done
          sha256sum *.zip *.tar.gz verification-*.json desktop-*.png > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "Yunsevo Drive $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
